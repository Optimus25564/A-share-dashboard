name: Scan Signals

# 每个交易日两次: A股收盘后 (15:30 北京 = 07:30 UTC) 和美股收盘后 (16:30-17:30 ET ≈ 21:30 UTC)。
# 每次扫描都会与上一次状态对比 (scan_signals.compute_changes):
#   有触发 (个股信号变化 / 宏观门控开关 / 仓位建议变化 / Top5 变化) → 推送并写明触发原因;
#   无触发 → sender 静默跳过, 不打扰。
# 注意: GITHUB_TOKEN 的 push 不会触发 on:push workflow, 所以本 workflow 在提交状态后直接推送通知。
on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scan-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan weekly signals (real K-lines)
        run: python .github/scripts/scan_signals.py

      - name: Update market caps (daily, feeds durability/valuation factors)
        run: python scripts/update_market_caps.py || echo "市值更新失败, 沿用旧值"

      - name: Recompute quant scores (6-factor model)
        run: node scripts/build_model_factor_scores.mjs

      - name: Manage auto portfolio (event-driven rebalance per rules)
        run: python .github/scripts/manage_portfolio.py

      - name: Commit state archives
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alerts_state.json data/alerts_state_us.json \
                  data/portfolio_a.json data/portfolio_us.json \
                  data/model_scores.json MODEL_FACTOR_SCORES.md \
                  data/companies.json data/companies_us.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "alerts: 每日信号扫描 $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send notifications (WeChat + Email, 仅有触发时)
        if: steps.commit.outputs.changed == 'true'
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          GMAIL_PASS: ${{ secrets.GMAIL }}
          GMAIL_USER: hana.b.luo@gmail.com
        run: python .github/scripts/send_alerts_from_state.py
